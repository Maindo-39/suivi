# EXPÉRIENCE — dépôt PUBLIC. Même témoin que dans le dépôt privé.
# But : savoir si le planificateur de GitHub se comporte différemment
# selon que le dépôt est public ou privé.
name: Test horloge public

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "$(date -u '+%Y-%m-%d %H:%M UTC') — ${{ github.event_name }}" >> horloge.txt
          git config user.name  "test-horloge"
          git config user.email "test@users.noreply.github.com"
          git add horloge.txt
          git commit -m "horloge $(date -u '+%H:%M')"
          git push
